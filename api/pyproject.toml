[project]
name = "transducer-api"
version = "0.1.0"
description = "Read-only FastAPI access to the transducer PostgreSQL store."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
transducer-api = "transducer_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transducer_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's dependency injection requires calls such as Depends(...) in
# argument defaults; B008 does not apply to endpoint modules.
[tool.ruff.lint.per-file-ignores]
"transducer_api/app.py" = ["B008"]
"transducer_api/auth.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a disposable PostgreSQL database; skipped when absent",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
