name: transducer-dash

services:
  db:
    image: postgres:16
    container_name: transducer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transducer}
      POSTGRES_USER: ${POSTGRES_USER:-transducer_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${SITE_TIMEZONE:-America/New_York}
    ports:
      # Bind to the internal interface in production; the skeleton publishes
      # on all interfaces for local testing only.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL files placed here run only when the data volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-transducer_admin} -d ${POSTGRES_DB:-transducer}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

