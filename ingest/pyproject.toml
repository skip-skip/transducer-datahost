[project]
name = "transducer-ingest"
version = "0.1.0"
description = "Parse .xle transducer exports and load uncompensated readings into PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "psycopg[binary]>=3.2",
    "defusedxml>=0.7",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
transducer-report = "transducer_ingest.report:main"
transducer-ingest = "transducer_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transducer_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the full .xle export or TRANSDUCER_TEST_DSN; skipped when absent",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
