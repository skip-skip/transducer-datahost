[project]
name = "transducer-dashboard"
version = "0.1.0"
description = "Read-only dashboard for the transducer data warehouse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "filelock>=3.13",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
transducer-dashboard = "transducer_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transducer_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's dependency injection requires calls such as Depends(...) in
# argument defaults; B008 does not apply to endpoint modules.
[tool.ruff.lint.per-file-ignores]
"transducer_dashboard/app.py" = ["B008"]
