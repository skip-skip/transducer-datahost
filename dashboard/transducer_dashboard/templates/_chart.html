{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if chart %}
<div class="chart" data-chart>
  <script type="application/json" class="chart-data">{{ chart | tojson }}</script>
  <div class="plot"></div>
</div>
{% elif figure and figure.series_id %}
<p class="hint">No data available for this range.</p>
{% else %}
<p class="hint">Choose a source and analyte, then save.</p>
{% endif %}
