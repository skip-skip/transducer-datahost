{% set selected_series_id = figure.series_id %}
<h2 class="options-title">{{ figure.name }}</h2>

<form class="options-form" method="post"
      action="{{ url_for('update_scene_figure', scope=scope, scene_id=scene.id, figure_id=figure.id) }}">
  <div class="field">
    <label for="figure-name">Name</label>
    <input id="figure-name" name="name" value="{{ figure.name }}" required
           {% if not can_edit %}disabled{% endif %}>
  </div>

  <div class="field">
    <label for="location">Location</label>
    <select id="location" name="location_id"
            hx-get="{{ url_for('analytes_partial') }}"
            hx-target="#analyte-field"
            hx-swap="innerHTML"
            hx-trigger="change"
            hx-include="this"
            {% if not can_edit %}disabled{% endif %}>
      <option value="">All locations</option>
      {% for location in locations %}
      <option value="{{ location.location_id }}"
        {% if figure.location_id is not none and figure.location_id == location.location_id %}selected{% endif %}>
        {{ location.name }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="field" id="analyte-field">
    {% include "_analytes.html" %}
  </div>

  {% if can_edit %}
  <div class="actions">
    <button type="submit">Save figure</button>
  </div>
  {% endif %}
</form>

{% if can_edit %}
<form method="post"
      action="{{ url_for('delete_scene_figure', scope=scope, scene_id=scene.id, figure_id=figure.id) }}"
      onsubmit="return confirm('Delete this figure?');">
  <button type="submit" class="danger">Delete figure</button>
</form>
{% endif %}

<p class="hint">
  Grid position {{ figure.layout.x }},{{ figure.layout.y }}
  · size {{ figure.layout.w }}×{{ figure.layout.h }}
</p>
