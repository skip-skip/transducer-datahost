<p class="grid-status hint" data-grid-status role="status" aria-live="polite"></p>
<div class="scene-grid grid-stack"
     data-scene-id="{{ scene.id }}"
     data-grid-cols="{{ scene.grid.cols }}"
     data-row-height="{{ scene.grid.row_height }}"
     data-layout-url="{{ url_for('save_scene_layout', scope=scope, scene_id=scene.id) }}"
     data-can-edit="{{ 'true' if can_edit else 'false' }}">
  {% for item in figures %}
    {% set figure_item = item %}
    {% include "_figure_panel.html" %}
  {% endfor %}
</div>
{% if not figures %}
<p class="hint scene-empty">This scene has no figures yet. Add one from the options pane.</p>
{% endif %}
