<div class="scope-tabs">
  <form method="post" action="{{ url_for('set_view') }}">
    <input type="hidden" name="scope" value="personal">
    <button type="submit" class="tab{% if scope == 'personal' %} active{% endif %}">My figures</button>
  </form>
  <form method="post" action="{{ url_for('set_view') }}">
    <input type="hidden" name="scope" value="shared">
    <button type="submit" class="tab{% if scope == 'shared' %} active{% endif %}">Shared</button>
  </form>
</div>

{% if can_edit %}
<form method="post" action="{{ url_for('create_figure') }}" class="new-figure">
  <input type="hidden" name="scope" value="{{ scope }}">
  <button type="submit">+ New figure</button>
</form>
{% else %}
<p class="hint">Read-only shared view.</p>
{% endif %}

<ul class="figure-list">
  {% for item in figures %}
  <li>
    <form method="post" action="{{ url_for('select_figure') }}">
      <input type="hidden" name="scope" value="{{ scope }}">
      <input type="hidden" name="figure_id" value="{{ item.id }}">
      <button type="submit" class="figure-link{% if figure and figure.id == item.id %} active{% endif %}">
        <span class="figure-name">{{ item.name }}</span>
        {% if scope == 'shared' and item.created_by %}<span class="badge">{{ item.created_by }}</span>{% endif %}
      </button>
    </form>
  </li>
  {% else %}
  <li class="hint">No figures yet.</li>
  {% endfor %}
</ul>
